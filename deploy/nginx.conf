# Nginx site config for the static blog.
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/blog.conf
#   sudo ln -s /etc/nginx/sites-available/blog.conf /etc/nginx/sites-enabled/blog.conf
#   sudo nginx -t && sudo systemctl reload nginx
# (RHEL/CentOS/Alpine: put it in /etc/nginx/conf.d/blog.conf instead.)
#
# Replace `blog.example.com` and `/var/www/blog` with your own values.

# Cache policy by path. Kept in one map so every response gets exactly one Cache-Control
# header and the security headers below are never dropped by a location-level add_header.
map $uri $blog_cache_control {
    # Fingerprinted build output (JS/CSS/optimized images): the file name changes whenever
    # the content does, so it can be cached forever.
    ~^/_astro/                                       "public, max-age=31536000, immutable";
    # Other static files copied from public/ (favicon, images you put there).
    ~*\.(?:ico|svg|png|jpe?g|gif|webp|avif|woff2?)$  "public, max-age=604800";
    /rss.xml                                         "public, max-age=3600";
    # HTML, search index, sitemap: always revalidate so new posts show up immediately.
    default                                          "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    # Contents of dist/ (index.html must be directly inside this directory).
    root /var/www/blog;
    index index.html;

    charset utf-8;
    server_tokens off;
    # Directory redirects (/posts/foo -> /posts/foo/) stay relative, so they work behind proxies/CDNs.
    absolute_redirect off;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml
               application/javascript application/json image/svg+xml;
    # If your Nginx was built with ngx_brotli you can also enable `brotli on;` here.

    # --- Headers ------------------------------------------------------------
    # Note: don't add `add_header` inside the locations below — in Nginx that silently
    # discards all of these server-level headers for that location.
    add_header Cache-Control $blog_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Routes -------------------------------------------------------------
    # Pages are emitted as <route>/index.html, e.g. /posts/hello-world/index.html.
    # /posts/hello-world (no slash) is redirected to /posts/hello-world/ automatically.
    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        try_files $uri =404;
        access_log off;
    }

    location = /rss.xml {
        types { }
        default_type application/rss+xml;
    }

    # Custom 404 page generated by the build.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Never serve dotfiles (.git, .env, ...) if they end up in the web root by mistake.
    location ~ /\. {
        deny all;
    }
}

# --- HTTPS (recommended) -----------------------------------------------------
# The easiest way is Certbot: `sudo certbot --nginx -d blog.example.com`, which edits this
# file for you. If you manage certificates yourself, use something like:
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name blog.example.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;                      # Nginx >= 1.25.1; older: `listen 443 ssl http2;`
#     server_name blog.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     ...everything from the server block above, from `root` down...
# }
